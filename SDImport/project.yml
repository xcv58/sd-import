name: SDImportMacAppStore

options:
  bundleIdPrefix: media.jenny
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: 2.46.0
  postGenCommand: /bin/bash Packaging/MacAppStore/patch_storekit_scheme.sh

packages:
  SDImportCorePackage:
    path: Packages/SDImportCore

settings:
  base:
    DEVELOPMENT_TEAM: 5736QK4NZX
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"

targets:
  SDImportAgent:
    type: application
    platform: macOS
    sources:
      - path: Packages/SDImportCore/Sources/SDImportAgent
    dependencies:
      - package: SDImportCorePackage
        product: SDImportCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Packaging/MacAppStore/SDImportAgent.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/MacAppStore/SDImportAgent-Info.plist
        MARKETING_VERSION: "1.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.sdimport.agent
        PRODUCT_NAME: SDImportAgent
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: SD Import Agent Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: SD Import Agent App Store
    postBuildScripts:
      - name: Embed Privacy Manifest
        script: |
          set -euo pipefail
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PrivacyInfo.xcprivacy"
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Packaging/MacAppStore/SDImportAgentPrivacyInfo.xcprivacy" "$destination"
        inputFiles:
          - $(SRCROOT)/Packaging/MacAppStore/SDImportAgentPrivacyInfo.xcprivacy
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PrivacyInfo.xcprivacy

  SDImportForMac:
    type: application
    platform: macOS
    productName: SD Card Import
    sources:
      - path: Packages/SDImportCore/Sources/SDImportApp
      - path: Packaging/MacAppStore/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SDImportCorePackage
        product: SDImportCore
      - package: SDImportCorePackage
        product: SDImportCommerce
      - target: SDImportAgent
        embed: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Packaging/MacAppStore/SDImport.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/MacAppStore/SDImport-Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.sdimport
        PRODUCT_MODULE_NAME: SDImportForMac
        PRODUCT_NAME: SD Card Import
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SDIMPORT_MAC_APP_STORE"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: SD Import for Mac Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: SD Import for Mac App Store
    postBuildScripts:
      - name: Generate App Icon
        script: |
          set -euo pipefail
          output="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SDImport.icns"
          CLANG_MODULE_CACHE_PATH="${PROJECT_TEMP_DIR}/IconModuleCache" \
            xcrun swift "${SRCROOT}/../script/generate_icon.swift" "$output"
        inputFiles:
          - $(SRCROOT)/../script/generate_icon.swift
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SDImport.icns
      - name: Embed Background Helper
        script: |
          set -euo pipefail
          source_bundle="${BUILT_PRODUCTS_DIR}/SDImportAgent.app"
          destination_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems"
          destination_bundle="${destination_dir}/SDImportAgent.app"
          test -d "$source_bundle"
          rm -rf "$destination_bundle"
          mkdir -p "$destination_dir"
          /usr/bin/ditto "$source_bundle" "$destination_bundle"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/SDImportAgent.app
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LoginItems/SDImportAgent.app
    scheme:
      testTargets:
        - SDImportStoreKitTests
      storeKitConfiguration: Packaging/MacAppStore/SDImport.storekit

  SDImportStoreKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/SDImportCore/Tests/SDImportStoreKitTests
      - path: Packaging/MacAppStore/SDImport.storekit
        buildPhase: resources
    dependencies:
      - target: SDImportForMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.sdimport.storekit-tests
        SWIFT_VERSION: "6.0"
